name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan + redaction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: redaction gate (no OCIDs/IPs/secrets in tracked files)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.ico) continue ;;
            esac
            if ! python3 scripts/redact.py --check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::sensitive value detected by redact.py"
              python3 scripts/redact.py --summary "$f" >/dev/null || true
              fail=1
            fi
          done < <(git ls-files)
          exit "$fail"

  lint:
    name: shell + python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          # -x follows sourced files; --severity=warning ignores info notes (e.g. SC1091)
          shellcheck -x --severity=warning scripts/*.sh install.sh bootstrap.sh

      - name: ruff + compile
        run: |
          pip install ruff
          ruff check scripts/*.py
          python3 -m py_compile scripts/*.py hooks/*.py

      - name: unit tests (safety core — redact + destructive guard)
        run: |
          pip install pytest
          python3 -m pytest tests/ -q

  bash32:
    name: bash 3.2 portability (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: confirm /bin/bash is 3.2
        run: /bin/bash --version | head -1

      - name: syntax-check all scripts under bash 3.2
        run: |
          for f in scripts/*.sh install.sh bootstrap.sh tests/*.sh; do
            /bin/bash -n "$f"
          done

      - name: empty-array / nounset smoke (the macOS default-bash trap)
        run: /bin/bash tests/bash32_smoke.sh

      - name: action-ledger smoke (audit_log + run_mutating, redacted)
        run: /bin/bash tests/audit_ledger_smoke.sh

      - name: oci_cli retry/backoff smoke (throttle vs 5xx vs mutation)
        run: /bin/bash tests/oci_retry_smoke.sh

      - name: common helpers smoke (tenancy/compartment/help/id-flag)
        run: /bin/bash tests/common_helpers_smoke.sh

      - name: oci_logan failure-handling smoke (auth-denied vs empty vs rows)
        run: /bin/bash tests/oci_logan_smoke.sh

      - name: oci_project lifecycle smoke (status/bootstrap-dry-run/teardown-plan)
        run: /bin/bash tests/oci_project_smoke.sh

      - name: oci_adb lister smoke (ECPU GB vs OCPU TB storage, no-OCID, empty)
        run: /bin/bash tests/oci_adb_smoke.sh

  validate:
    name: validate skill manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: skill frontmatter + plugin/marketplace + evals JSON
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml

          errors = []

          def check_frontmatter(path):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  errors.append(f"{path}: missing YAML frontmatter")
                  return
              fm = text.split("---", 2)[1]
              data = yaml.safe_load(fm) or {}
              for key in ("name", "description"):
                  if not data.get(key):
                      errors.append(f"{path}: frontmatter missing '{key}'")

          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("skills/: no skills/<name>/SKILL.md found")
          for p in skills:
              check_frontmatter(p)

          def check_json(path):
              try:
                  json.loads(pathlib.Path(path).read_text())
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"{path}: invalid JSON ({exc})")

          for j in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "evals/evals.json"):
              check_json(j)

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"all manifests valid ({len(skills)} skills)")
          PY

      - name: eval routing validator
        run: python3 tests/check_eval_routing.py

      - name: no stale domain-count drift in docs/manifests
        run: |
          set -euo pipefail
          if grep -REn 'six domain|four admin domain|nine domain|nine domains|9 control-plane' README.md AGENTS.md commands docs evals references scripts skills harness .claude-plugin/; then
            echo "::error::stale domain count (expected ten domain skills plus oci-project) — update docs/manifests"
            exit 1
          fi
          echo "domain-count references consistent"
