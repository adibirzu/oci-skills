name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan + redaction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: redaction gate (no OCIDs/IPs/secrets in tracked files)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.ico) continue ;;
            esac
            if ! python3 scripts/redact.py --check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::sensitive value detected by redact.py"
              python3 scripts/redact.py --summary "$f" >/dev/null || true
              fail=1
            fi
          done < <(git ls-files)
          exit "$fail"

  lint:
    name: shell + python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          # -x follows sourced files; --severity=warning ignores info notes (e.g. SC1091)
          shellcheck -x --severity=warning scripts/*.sh install.sh bootstrap.sh

      - name: ruff + compile
        run: |
          pip install ruff
          ruff check scripts/*.py
          python3 -m py_compile scripts/*.py hooks/*.py

      - name: action-contract static gate
        run: python3 scripts/check_action_contracts.py scripts/*.sh

      - name: unit tests + source-scoped branch coverage
        run: |
          pip install pytest coverage
          coverage erase
          coverage run -m pytest tests/ -q
          coverage report

  bash32:
    name: bash 3.2 portability (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: confirm /bin/bash is 3.2
        run: /bin/bash --version | head -1

      - name: syntax-check all scripts under bash 3.2
        run: |
          for f in scripts/*.sh install.sh bootstrap.sh tests/*.sh; do
            /bin/bash -n "$f"
          done

      - name: empty-array / nounset smoke (the macOS default-bash trap)
        run: /bin/bash tests/bash32_smoke.sh

      - name: action-ledger smoke (audit_log + run_action, redacted)
        run: /bin/bash tests/audit_ledger_smoke.sh

      - name: oci_cli retry/backoff smoke (throttle vs 5xx vs mutation)
        run: /bin/bash tests/oci_retry_smoke.sh

      - name: common helpers smoke (tenancy/compartment/help/id-flag)
        run: /bin/bash tests/common_helpers_smoke.sh

      - name: oci_logan failure-handling smoke (auth-denied vs empty vs rows)
        run: /bin/bash tests/oci_logan_smoke.sh

      - name: oci_project lifecycle smoke (status/bootstrap-dry-run/teardown-plan)
        run: /bin/bash tests/oci_project_smoke.sh

      - name: oci_adb lister smoke (ECPU GB vs OCPU TB storage, no-OCID, empty)
        run: /bin/bash tests/oci_adb_smoke.sh

  validate:
    name: validate skill manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: skill frontmatter + plugin/marketplace + evals JSON
        run: |
          pip install pyyaml pytest
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml

          errors = []

          def check_frontmatter(path):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  errors.append(f"{path}: missing YAML frontmatter")
                  return
              fm = text.split("---", 2)[1]
              data = yaml.safe_load(fm) or {}
              for key in ("name", "description"):
                  if not data.get(key):
                      errors.append(f"{path}: frontmatter missing '{key}'")

          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("skills/: no skills/<name>/SKILL.md found")
          for p in skills:
              check_frontmatter(p)
              data = yaml.safe_load(p.read_text(encoding="utf-8").split("---", 2)[1]) or {}
              extras = sorted(set(data) - {"name", "description"})
              if extras:
                  errors.append(f"{p}: unsupported frontmatter fields {extras}")
              if len(str(data.get("description", ""))) > 1024:
                  errors.append(f"{p}: description exceeds 1024 characters")
              if not (p.parent / "agents" / "openai.yaml").is_file():
                  errors.append(f"{p.parent}: missing agents/openai.yaml")

          def check_json(path):
              try:
                  json.loads(pathlib.Path(path).read_text())
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"{path}: invalid JSON ({exc})")

          for j in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ".codex-plugin/plugin.json", "evals/evals.json"):
              check_json(j)

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"all manifests valid ({len(skills)} skills)")
          PY

      - name: eval routing validator
        run: python3 tests/check_eval_routing.py

      - name: routing, inventory, and manifest parity
        run: python3 -m pytest tests/test_routing_consistency.py tests/test_v2_contracts.py -q

  terraform:
    name: Terraform and platform-bundle fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: format fixtures
        run: terraform fmt -check -recursive skills/oci-terraform-authoring/assets/starter skills/oci-developer-services/assets/terraform skills/oci-events-functions/assets/terraform tests/fixtures/platform-bundles

      - name: initialize and validate starter without backend or credentials
        run: |
          terraform -chdir=skills/oci-terraform-authoring/assets/starter init -backend=false -input=false
          terraform -chdir=skills/oci-terraform-authoring/assets/starter validate
          terraform -chdir=skills/oci-terraform-authoring/assets/starter test

      - name: validate developer and Queue modules against the provider schema
        run: |
          for module in skills/oci-developer-services/assets/terraform/private-platform skills/oci-events-functions/assets/terraform/queue; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done

      - name: validate five bundles and CLI contracts offline
        run: |
          for bundle in tests/fixtures/platform-bundles/*; do
            python3 scripts/platform_bundle.py validate "$bundle/platform-bundle.yaml"
            python3 scripts/oci_cli_lint.py --no-help "$bundle/cli/command-plan.json"
            terraform -chdir="$bundle/terraform" init -backend=false -input=false
            terraform -chdir="$bundle/terraform" validate
          done
