schema_version: 1
pipeline: oci-skills-delivery
version: "2.0.0-rc.3"

skill_pack:
  name: oci-skills
  version: "2.0.0-rc.3"
  manifests:
    - .claude-plugin/plugin.json
    - .claude-plugin/marketplace.json
    - .codex-plugin/plugin.json
    - docs/product/contracts/install-manifest.json
    - harness/gemini/gemini-extension.json
  checksum_manifest: generated/release/skill-pack-checksums.json
  checksum_schema: schemas/skill-pack-checksums.schema.json
  archive_builder: scripts/package_skill_pack.py
  archive_format: tar.gz

mcp_surface:
  name: oci-mcp-gateway
  official_oracle_product: false
  authoritative_path: cli-sdk
  reference: references/mcp-gateway.md
  namespacing: "<backend>_<tool>"
  backends:
    - logan
    - oci
    - security
    - finops
    - db-observatory
  auth_modes:
    - idcs-jwt
    - static-token
  mutations_allowed: false

digest_pinning:
  algorithm: sha256
  ordering: bytewise-path
  symlinks_allowed: false
  unpinned_dependencies: reject
  source_date_epoch_normalized: true
  sbom_path: generated/security/oci-skills.cdx.json
  sbom_format: CycloneDX-1.6
  sbom_check_command: "python3 scripts/generate_sbom.py --check"
  checksum_manifest_path: generated/release/skill-pack-checksums.json
  checksum_check_command: "python3 scripts/package_skill_pack.py --check"

execution_tiers:
  workstation_arm64:
    arch: arm64
    container_execution: false
    entrypoint: scripts/ci/gate.sh
    stages:
      - name: sbom_freshness
        command: "python3.11 scripts/generate_sbom.py --check"
      - name: checksum_manifest
        command: "python3.11 scripts/package_skill_pack.py --check"
      - name: redaction_gate
        command: "git ls-files -z --cached --others --exclude-standard | python3.11 scripts/redaction_gate.py --root ."
      - name: ruff_lint
        command: "ruff check --select E4,E7,E9,F scripts/*.py tests/test_package_skill_pack.py tests/test_delivery_pipeline_gate.py && ruff check scripts/package_skill_pack.py tests/test_package_skill_pack.py tests/test_delivery_pipeline_gate.py"
      - name: shellcheck_lint
        command: "shellcheck -x --severity=warning scripts/*.sh scripts/ci/gate.sh install.sh bootstrap.sh"
      - name: deterministic_pytest
        command: "python3.11 -m pytest -q tests/test_package_skill_pack.py tests/test_delivery_pipeline_gate.py tests/test_codex_plugin_manifest.py tests/test_package_readiness.py tests/test_shipped_surface_inventory.py tests/test_operator_inventory.py tests/test_ci_quality_gates.py"
  container_amd64:
    arch: linux/amd64
    container_execution: true
    workstation_refusal_env: "GATE_FORCE_CONTAINER=1"
    refusal_policy: "Fail closed before stage 1 when GATE_FORCE_CONTAINER=1 is set on a native ARM64 workstation."
    github_workflow: .github/workflows/ci.yml
